<html>
<head>
    <title>My Study Notes 🌷</title>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fdf1f5;
            color: #5b4650;
            text-align: center;

        header {
            padding: 60px 20px 40px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #7b5263;
        }

        header p {
            font-size: 18px;
            color: #92717f;
        }

        .subjects {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 20px;
        }

        .card {
            background: white;
            width: 180px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(150, 100, 120, 0.15);
            cursor: pointer;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card h2 {
            margin: 10px 0;
        }

        .card p {
            color: #92717f;
        }

        #notes {
            display: none;
            background: white;
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(150, 100, 120, 0.15);
        }

        #notes h2 {
            color: #7b5263;
        }

        footer {
            margin-top: 60px;
            padding: 20px;
            color: #92717f;
        }
    </style>
</head>

            <p>Explore the universe</p>
        </div>

    </div>

    <div id="notes">
        <h2 id="noteTitle"></h2>
