<!DOCTYPE html>
<html>
<head>
    <title>My Study Notes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f1f4;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #6b4c5a;
            font-size: 40px;
        }

        p {
            color: #765f68;
            font-size: 18px;
        }

        .subjects {
            margin-top: 30px;
        }

        button {
            background: white;
            border: none;
            padding: 15px 25px;
            margin: 10px;
            border-radius: 15px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 10px #ddd;
        }

        button:hover {
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

    <h1>My Study Notes 📚</h1>

    <p>Welcome to my little study corner 🌷</p>

    <div class="subjects">
        <button>🌿 Biology</button>
        <button>⚗️ Chemistry</button>
        <button>⚡ Physics</button>
    </div>

</body>
</html>
